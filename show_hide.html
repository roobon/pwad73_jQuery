<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="js/jquery.min.js"></script>
  </head>
  <body>
    <p>
      Lorem ipsum dolor sit amet consectetur adipisicing elit. Unde laudantium
      quasi quidem nihil fuga a quaerat? Enim recusandae distinctio minus? Neque
      reiciendis vel minima magni architecto ratione voluptates veniam placeat.
    </p>

    <button class="btn1">Hide all</button>
    <button class="btn2">Show All</button>
    <button class="btn3">Show/Hide</button>

    <script>
      $(document).ready(function () {
        $(".btn1").click(function () {
          $("p").hide();
        });
        $(".btn2").click(function () {
          $("p").show();
        });
        $(".btn3").click(function () {
          $("p").toggle();
        });
      });
    </script>
  </body>
</html>
